<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>response-context</title>
<meta name="description" content="Automated humanitarian situation monitoring and funding context.">
<style>
  :root {
    --ink: #1a1a2e;
    --muted: #5a5a72;
    --accent: #2563eb;
    --bg: #fafaf7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  main { max-width: 42rem; }
  h1 {
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 1rem;
  }
  h1 .dot { color: var(--accent); }
  p {
    font-size: 1.125rem;
    line-height: 1.7;
    color: var(--muted);
    margin: 0 0 1rem;
  }
  .note {
    display: inline-block;
    margin-top: 1.5rem;
    padding: 0.4rem 0.9rem;
    border: 1px solid #d8d8cf;
    border-radius: 999px;
    font-size: 0.875rem;
    color: var(--muted);
    background: #fff;
  }
  footer {
    margin-top: 3rem;
    font-size: 0.875rem;
    color: var(--muted);
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1>response<span class="dot">-</span>context</h1>
  <p>Automated humanitarian situation monitoring and funding context.</p>
  <p>This site is being set up. The first version is on its way.</p>
  <span class="note">Under construction</span>
  <footer>
    A <a href="https://digitalhumanitarians.com">Digital Humanitarian Network</a> project.
  </footer>
</main>
</body>
</html>
